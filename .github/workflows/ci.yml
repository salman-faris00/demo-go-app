name: ci for go app
on: 
  push:
    branches: [main]

jobs:
    test-and-build:
        runs-on: ubuntu-latest
        steps:

          - name: checkout code
            uses: actions/checkout@v6


          - name: set up go
            uses: actions/setup-go@v4
            with:
              go-version: '1.24.1'

          - name: test the app
            run: go test -v 

          - name: build the app
            run: go build -o myapp .

          - name: docker login
            uses: docker/login-action@v2
            with: 
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

          - name: build docker image
            run: docker build -t ${{ secrets.DOCKER_USERNAME }}/go-web-app:v2.0 .

          - name: push the docker image to dockerhub
            run: docker push ${{ secrets.DOCKER_USERNAME }}/go-web-app:v2.0

            
            

